name: productix-erpnext

# ─────────────────────────────────────────────────────────────────────────
# Combined on-prem stack: Productix (frontend/backend/Postgres) + ERPNext
# (frontend/backend/websocket/workers/scheduler/MariaDB/Redis), fronted by
# a single Caddy reverse proxy. Only Caddy is published to the host; every
# database and Redis instance stays on the internal network.
#
# ERPNext service shapes follow the official frappe_docker single-server
# pattern (frappe_docker/compose.yaml + overrides/compose.mariadb.yaml +
# overrides/compose.redis.yaml as of ERPNext v16.32.3) — see
# https://github.com/frappe/frappe_docker/blob/main/docs/02-setup for
# upstream reference when upgrading.
# ─────────────────────────────────────────────────────────────────────────

x-erpnext-image: &erpnext_image
  image: frappe/erpnext:${ERPNEXT_VERSION:-v16.32.3}
  pull_policy: ${PULL_POLICY:-missing}
  restart: unless-stopped

x-erpnext-backend-defaults: &erpnext_backend_defaults
  <<: *erpnext_image
  networks: [productix_stack]
  volumes:
    - erpnext_sites:/home/frappe/frappe-bench/sites
    - erpnext_logs:/home/frappe/frappe-bench/logs
  depends_on:
    erpnext-configurator:
      condition: service_completed_successfully

services:
  # ── Reverse proxy ────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    networks: [productix_stack]
    ports:
      - "${HTTP_PUBLISH_PORT:-80}:80"
      - "${HTTPS_PUBLISH_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - productix_frontend_dist:/srv/productix-frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      PRODUCTIX_DOMAIN: ${PRODUCTIX_DOMAIN:-app.productix.local}
      PRODUCTIX_API_DOMAIN: ${PRODUCTIX_API_DOMAIN:-api.productix.local}
      ERPNEXT_DOMAIN: ${ERPNEXT_DOMAIN:-erp.productix.local}
    depends_on:
      productix-frontend-build:
        condition: service_completed_successfully
      productix-backend:
        condition: service_healthy

  # ── Productix ─────────────────────────────────────────────────────────────
  productix-frontend-build:
    build:
      context: ../../
      dockerfile: deploy/on-prem/productix/Dockerfile.frontend-build
      args:
        VITE_API_BASE_URL: https://${PRODUCTIX_API_DOMAIN:-api.productix.local}
        VITE_PHP_KPI_URL: ${VITE_PHP_KPI_URL:-https://license.techohub.net/kpi_dashboard/api}
    restart: "no"
    volumes:
      - productix_frontend_dist:/out

  productix-backend:
    build:
      context: ../../
      dockerfile: deploy/on-prem/productix/Dockerfile.backend
    restart: unless-stopped
    networks: [productix_stack]
    depends_on:
      productix-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${PRODUCTIX_DB_USER:-productix}:${PRODUCTIX_DB_PASSWORD}@productix-db:5432/${PRODUCTIX_DB_NAME:-productix}
      CORS_ORIGINS: https://${PRODUCTIX_DOMAIN:-app.productix.local}
      CENTRAL_LICENSE_SERVER_URL: ${CENTRAL_LICENSE_SERVER_URL:-https://license.techohub.net}
      LICENSE_SIGNING_KEY: ${LICENSE_SIGNING_KEY}
      PRODUCTIX_ENFORCE_CLIENT_LICENSING: ${PRODUCTIX_ENFORCE_CLIENT_LICENSING:-true}
      EMAIL: ${EMAIL:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      FRONTEND_VERIFY_URL: https://${PRODUCTIX_DOMAIN:-app.productix.local}/verify-result
      BACKEND_VERIFY_ENDPOINT: https://${PRODUCTIX_API_DOMAIN:-api.productix.local}/verify-email
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MASTER_KILL_TOKEN: ${MASTER_KILL_TOKEN}
      MASTER_KILL_ALLOWED_IP: ${MASTER_KILL_ALLOWED_IP:-}
      # ERPNext connector (Phase 4 — not yet implemented in productix_fastapi,
      # wired here so it's a drop-in once the router exists).
      ERPNEXT_BASE_URL: http://erpnext-frontend:8080
      ERPNEXT_API_KEY: ${ERPNEXT_API_KEY:-}
      ERPNEXT_API_SECRET: ${ERPNEXT_API_SECRET:-}
      ERPNEXT_TIMEOUT_MS: ${ERPNEXT_TIMEOUT_MS:-8000}
      ERPNEXT_ALLOWED_DOCTYPES: ${ERPNEXT_ALLOWED_DOCTYPES:-Item,Warehouse,Stock Ledger Entry,Work Order}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/docs", "-o", "/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  productix-db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [productix_stack]
    environment:
      POSTGRES_DB: ${PRODUCTIX_DB_NAME:-productix}
      POSTGRES_USER: ${PRODUCTIX_DB_USER:-productix}
      POSTGRES_PASSWORD: ${PRODUCTIX_DB_PASSWORD}
    volumes:
      - productix_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PRODUCTIX_DB_USER:-productix} -d ${PRODUCTIX_DB_NAME:-productix}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ERPNext ───────────────────────────────────────────────────────────────
  erpnext-configurator:
    <<: *erpnext_image
    networks: [productix_stack]
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: erpnext-db
      DB_PORT: "3306"
      REDIS_CACHE: erpnext-redis-cache:6379
      REDIS_QUEUE: erpnext-redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs
    depends_on:
      erpnext-db:
        condition: service_healthy
    restart: "no"

  erpnext-create-site:
    <<: *erpnext_image
    networks: [productix_stack]
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs
    entrypoint: ["bash", "-c"]
    command:
      - >
        wait-for-it -t 120 erpnext-db:3306;
        wait-for-it -t 120 erpnext-redis-cache:6379;
        wait-for-it -t 120 erpnext-redis-queue:6379;
        if [ -d "sites/frontend" ]; then
          echo "Site 'frontend' already exists, skipping creation";
        else
          bench new-site --mariadb-user-host-login-scope='%' \
            --admin-password="$$ERPNEXT_ADMIN_PASSWORD" \
            --db-root-username=root --db-root-password="$$MARIADB_ROOT_PASSWORD" \
            --install-app erpnext --set-default frontend;
        fi;
    environment:
      ERPNEXT_ADMIN_PASSWORD: ${ERPNEXT_ADMIN_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${ERPNEXT_DB_ROOT_PASSWORD}
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    restart: "no"

  erpnext-backend:
    <<: *erpnext_backend_defaults
    environment:
      GUNICORN_THREADS: ${ERPNEXT_GUNICORN_THREADS:-4}
      GUNICORN_WORKERS: ${ERPNEXT_GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: 120

  erpnext-frontend:
    <<: *erpnext_image
    networks: [productix_stack]
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: erpnext-backend:8000
      SOCKETIO: erpnext-websocket:9000
      # Single-site box: pin the site name so incoming Host headers (from
      # Caddy or a raw curl on the container) don't need to match a site.
      FRAPPE_SITE_NAME_HEADER: frontend
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs
    depends_on:
      - erpnext-backend
      - erpnext-websocket

  erpnext-websocket:
    <<: *erpnext_backend_defaults
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]

  erpnext-queue-short:
    <<: *erpnext_backend_defaults
    command: ["bench", "worker", "--queue", "short,default"]

  erpnext-queue-long:
    <<: *erpnext_backend_defaults
    command: ["bench", "worker", "--queue", "long,default,short"]

  erpnext-scheduler:
    <<: *erpnext_backend_defaults
    command: ["bench", "schedule"]

  erpnext-db:
    image: mariadb:11.8
    restart: unless-stopped
    networks: [productix_stack]
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${ERPNEXT_DB_ROOT_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${ERPNEXT_DB_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: 1
    volumes:
      - erpnext_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 5

  erpnext-redis-cache:
    image: redis:8.6-alpine
    restart: unless-stopped
    networks: [productix_stack]

  erpnext-redis-queue:
    image: redis:8.6-alpine
    restart: unless-stopped
    networks: [productix_stack]
    volumes:
      - erpnext_redis_queue_data:/data

networks:
  productix_stack:
    driver: bridge

volumes:
  productix_db_data:
  productix_frontend_dist:
  caddy_data:
  caddy_config:
  erpnext_sites:
  erpnext_logs:
  erpnext_db_data:
  erpnext_redis_queue_data:
